# Nginx server block for hrms.zalgostore.com
# Copy to /etc/nginx/sites-available/hrms.zalgostore.com then:
#   sudo ln -s /etc/nginx/sites-available/hrms.zalgostore.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run certbot AFTER this file is enabled (it edits this file to add SSL automatically):
#   sudo certbot --nginx -d hrms.zalgostore.com

server {
    listen 80;
    server_name hrms.zalgostore.com;

    # Frontend: static Vite build
    root /var/www/hrms/apps/frontend/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # Backend API — same origin as frontend, so no CORS headaches
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — needs the Upgrade/Connection headers for websockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 15m; # employee documents / logo uploads
}
